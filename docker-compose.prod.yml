services:
  backend:
    image: ghcr.io/juancadavidc/miganado-backend:${IMAGE_TAG:-latest}
    container_name: miganado-backend
    restart: unless-stopped
    pull_policy: always
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required (define it in .env.prod)}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (define it in .env.prod)}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required (define it in .env.prod)}
      PORT: 4000
    expose:
      - "4000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:4000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  frontend:
    image: ghcr.io/juancadavidc/miganado-frontend:${IMAGE_TAG:-latest}
    container_name: miganado-frontend
    restart: unless-stopped
    pull_policy: always
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
